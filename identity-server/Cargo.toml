[package]
name = "identity-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = { version="0.8.9", features=["macros"] }

uuid = { version="1.26.0", features=["v4", "serde"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"

sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "uuid", "sqlx-toml"] }

argon2 = { version = "0.6.0", features = ["getrandom"]}
rand = "0.10.2"

api-macros = { git = "https://github.com/jakob-rzeppa/Auth.git", branch = "main" }
fnmock = "0.3.0"

tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
