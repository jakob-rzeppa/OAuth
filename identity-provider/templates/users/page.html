{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}
    <h1>Users</h1>

    <div id="notice" role="status"></div>

    <section>
        <h2>New user</h2>
        <form class="inline" hx-post="/admin/users" hx-target="#users" hx-swap="beforeend"
              hx-on::after-request="if (event.detail.successful) this.reset()">
            <label>User name <input type="text" name="user_name" required></label>
            <fieldset>
                <legend>Roles</legend>
                {% for role in roles %}
                    <label class="check"><input type="checkbox" name="role_ids" value="{{ role.id }}"> {{ role.name }}</label>
                {% endfor %}
            </fieldset>
            <button type="submit">Create</button>
        </form>
    </section>

    <section>
        <table>
            <thead>
                <tr><th>User name</th><th>Display name</th><th>Roles</th><th>Password</th><th></th></tr>
            </thead>
            <tbody id="users">
                {% for row in rows %}
                    {{ row|safe }}
                {% endfor %}
            </tbody>
        </table>
    </section>
{% endblock %}
