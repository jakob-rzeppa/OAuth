<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
    <title>{% block title %}{% endblock %} · Identity Admin</title>
    <script src="/admin/static/htmx.min.js"></script>
    <style>
        :root { color-scheme: light dark; --accent: #2563eb; --muted: #6b7280; --border: #d1d5db; --danger: #dc2626; --success: #16a34a; }
        @media (prefers-color-scheme: dark) { :root { --muted: #9ca3af; --border: #4b5563; --danger: #f87171; --success: #4ade80; } }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px 16px; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
        main { max-width: 1040px; margin: 0 auto; display: grid; gap: 1.5rem; }
        h1 { margin: 0; font-size: 1.5rem; }
        h2 { margin: 0 0 .75rem; font-size: 1.125rem; }
        section { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; }
        form.inline { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; }
        label { display: grid; gap: .25rem; font-size: .875rem; font-weight: 500; }
        label.check { display: inline-flex; align-items: center; gap: .35rem; font-weight: 400; margin-right: .75rem; }
        fieldset { border: 0; padding: 0; margin: 0; }
        legend { font-size: .875rem; font-weight: 500; padding: 0; margin-bottom: .25rem; }
        input[type=text] { font: inherit; padding: .4rem .6rem; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; width: 100%; min-width: 8rem; }
        input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        button { font: inherit; font-size: .875rem; font-weight: 500; padding: .4rem .8rem; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
        button:hover { filter: brightness(1.1); }
        button.secondary { background: transparent; color: inherit; border-color: var(--border); }
        button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
        table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
        th, td { text-align: left; padding: .5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { font-size: .8125rem; color: var(--muted); font-weight: 500; }
        td.actions { display: flex; gap: .4rem; justify-content: flex-end; }
        .badge { display: inline-block; font-size: .75rem; padding: .05rem .45rem; border-radius: 999px; border: 1px solid var(--border); margin-right: .25rem; }
        .badge.warn { color: var(--danger); border-color: currentColor; }
        .muted { color: var(--muted); }
        #notice:empty { display: none; }
        #notice { padding: .6rem .8rem; border-radius: 6px; color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
        #notice.error { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
        #notice code { font-size: 1rem; padding: .1rem .4rem; border-radius: 4px; background: Canvas; color: CanvasText; user-select: all; }
        tr.htmx-request { opacity: .5; }
    </style>
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
