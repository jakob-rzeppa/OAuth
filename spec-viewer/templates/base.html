<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Swap error responses too, so failed partials show their error fragment. -->
    <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[2345]..", "swap": true, "error": false}]}'>
    <title>{% block title %}{% endblock %} – Spec Viewer</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="site-name" href="/">Spec Viewer</a>
    </header>
    {% block body %}{% endblock %}
</body>
</html>
