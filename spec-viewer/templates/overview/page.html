{% extends "base.html" %}

{% block title %}Specs{% endblock %}

{% block body %}
<main class="overview">
    <h1>Specs</h1>

    <form class="filters" action="/" method="get" role="search"
          hx-get="/spec-list" hx-target="#spec-list" hx-trigger="input changed delay:300ms, submit"
          hx-sync="this:replace" hx-indicator="#spec-list">
        <label class="search-field">
            <span class="visually-hidden">Search by title or abbreviation</span>
            <input type="search" name="q" value="{{ query.search }}"
                   placeholder="Search by title or abbreviation" autocomplete="off">
        </label>
        <label class="select-field">
            Show
            <select name="kind">
                <option value="all"{% if query.kind_value() == "all" %} selected{% endif %}>Published and drafts</option>
                <option value="published"{% if query.kind_value() == "published" %} selected{% endif %}>Published</option>
                <option value="draft"{% if query.kind_value() == "draft" %} selected{% endif %}>Drafts</option>
            </select>
        </label>
        <label class="select-field">
            Sort
            <select name="order">
                <option value="newest"{% if query.order_value() == "newest" %} selected{% endif %}>Newest first</option>
                <option value="oldest"{% if query.order_value() == "oldest" %} selected{% endif %}>Oldest first</option>
            </select>
        </label>
    </form>

    <ol id="spec-list" class="spec-list" hx-get="{{ spec_list_url }}" hx-trigger="load" aria-live="polite">
        <li class="status-message">Loading specs…</li>
    </ol>
</main>
{% endblock %}
