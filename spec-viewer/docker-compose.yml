services:
  spec-viewer:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    ports:
      - "${APP_HOST_PORT}:${APP_PORT}"
    extra_hosts:
      # Docker Desktop resolves host.docker.internal by itself, Docker on Linux doesn't.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$$APP_PORT/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
