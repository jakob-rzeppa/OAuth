[package]
name = "spec-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
prost-types = "0.14"
tonic = "0.14"
thiserror = "2.0.19"
async-trait = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# No TLS yet: the mock content server is plain http.
reqwest = { version = "0.13.5", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
ammonia = "4.2.3"
similar = "3.2.0"

spec-api = { git = "https://github.com/jakob-rzeppa/auth.git" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }

[dev-dependencies]
mockall = "0.15.0"
spec-api = { git = "https://github.com/jakob-rzeppa/auth.git", features = ["server"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5.3", features = ["util"] }
