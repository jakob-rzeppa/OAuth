# Development override. Layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --watch
#
# `--watch` syncs source changes into the container, where cargo-watch rebuilds
# and restarts the server, and streams the server log (plain `watch` does not).
# Changing a migration re-runs the migrator.
services:
  auth-server-db:
    # Also attach a non-internal network so the port can be published, and
    # `cargo sqlx prepare` can reach the database via LOCAL_POSTGRES_URL.
    networks:
      - auth-server
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

  auth-server-redis:
    # Also attach a non-internal network so the port can be published.
    networks:
      - auth-server
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  auth-server-migrate:
    develop:
      watch:
        - path: ./migrations
          action: rebuild

  auth-server:
    build:
      target: dev
    volumes:
      # Keep build artifacts and downloaded crates across container restarts,
      # so only the first start compiles everything.
      - auth-server-dev-target:/app/target
      - auth-server-dev-cargo-registry:/usr/local/cargo/registry
    healthcheck:
      # The first compile inside the container takes a while.
      start_period: 5m
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync
        - path: ./seed
          target: /app/seed
          action: sync
        - path: ./templates
          target: /app/templates
          action: sync
        - path: ./.sqlx
          target: /app/.sqlx
          action: sync
        - path: ./Cargo.toml
          target: /app/Cargo.toml
          action: sync
        - path: ./Cargo.lock
          target: /app/Cargo.lock
          action: sync

volumes:
  auth-server-dev-target:
  auth-server-dev-cargo-registry:
