<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <style>
        :root { color-scheme: light dark; --accent: #2563eb; --muted: #6b7280; --border: #d1d5db; --danger: #dc2626; }
        @media (prefers-color-scheme: dark) { :root { --muted: #9ca3af; --border: #4b5563; --danger: #f87171; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
        main { width: 100%; max-width: 360px; }
        h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
        p { margin: 0 0 1.5rem; color: var(--muted); }
        form { display: grid; gap: 1rem; }
        label { display: grid; gap: .25rem; font-size: .875rem; font-weight: 500; }
        input { font: inherit; padding: .5rem .75rem; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; }
        input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        button { font: inherit; font-weight: 500; padding: .6rem 1rem; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
        button:hover { filter: brightness(1.1); }
        button.secondary { background: transparent; color: inherit; border-color: var(--border); }
        .error { margin: 0; padding: .5rem .75rem; border-radius: 6px; color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
        .actions { display: flex; gap: .5rem; }
        .actions button { flex: 1; }
    </style>
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
