{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
    <h1>Change password</h1>
    <p>You logged in with a temporary password. Choose a new password to continue.</p>

    <form method="post" action="/login/password?return_to={{ return_to|urlencode_strict }}">
        {% if let Some(error_message) = error_message %}
            <p class="error">{{ error_message }}</p>
        {% endif %}

        <input type="hidden" name="user_name" autocomplete="username" value="{{ user_name }}">
        <label>Temporary password <input type="password" name="current_password" autocomplete="current-password" required autofocus></label>
        <label>New password <input type="password" name="new_password" autocomplete="new-password" required></label>
        <label>Repeat new password <input type="password" name="new_password_confirmation" autocomplete="new-password" required></label>

        <button type="submit">Change password</button>
    </form>
{% endblock %}
