{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
    <h1>Log in</h1>
    <p>Sign in to continue.</p>

    <form method="post" action="/login?return_to={{ return_to|urlencode_strict }}">
        {% if let Some(error_message) = error_message %}
            <p class="error">{{ error_message }}</p>
        {% endif %}

        <label>Username <input type="text" name="user_name" autocomplete="username" {% if let Some(user_name) = user_name %}value="{{ user_name }}" {% endif %}required autofocus></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" required></label>

        <button type="submit">Log in</button>
    </form>
{% endblock %}
