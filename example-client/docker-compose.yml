services:
  example-client:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    networks:
      - example-client
    volumes:
      # The server's own certificate and key, and the host's mkcert CA (public part only,
      # the CA key stays out of the containers) for the https calls it makes.
      - ./certs:/certs:ro
      - ${MKCERT_CAROOT}/rootCA.pem:/ca/rootCA.pem:ro
    extra_hosts:
      # The *.test names resolve to the host, where the other servers publish their ports.
      - "auth-server.test:host-gateway"
      - "identity-provider.test:host-gateway"
    ports:
      - "${APP_HOST_PORT:-8082}:${APP_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert $$SSL_CERT_FILE https://localhost:$$APP_PORT/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  # Carries the server's published port.
  example-client:
