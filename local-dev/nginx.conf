# Routes by domain name, without terminating TLS: nginx reads the server name the client
# asks for (SNI) from the TLS handshake and forwards the encrypted connection as is. The
# servers keep their own certificates and answer over https themselves, the gRPC one too.
# The upstreams are the service names on each server's network, with their APP_PORT.
events {}

stream {
    # Docker's DNS, so the upstreams are looked up when a connection arrives and the proxy
    # starts even when a server doesn't.
    resolver 127.0.0.11 valid=10s;

    map $ssl_preread_server_name $upstream {
        auth-server.test         auth-server:8080;
        identity-provider.test   identity-provider:8080;
        spec-provider.test       spec-provider:50051;
        spec-viewer.test         spec-viewer:8080;
    }

    server {
        listen 443;
        ssl_preread on;
        # A name that is not listed has no upstream, the connection is closed.
        proxy_pass $upstream;
    }
}
